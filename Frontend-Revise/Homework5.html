<!DOCTYPE html>
<html>

<head>
    <title>Rowspan and Colspan Example</title>
</head>

<body>

    <h2>Student Marks</h2>

    <table border="1" cellpadding="8" cellspacing="0">

        <caption>Student Result</caption>

        <tr>
            <th rowspan="2">Roll No</th>
            <th rowspan="2">Name</th>
            <th colspan="3">Marks</th>
        </tr>

        <tr>
            <th>Math</th>
            <th>Science</th>
            <th>English</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Nandani</td>
            <td>85</td>
            <td>90</td>
            <td>88</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Riya</td>
            <td>78</td>
            <td>82</td>
            <td>80</td>
        </tr>

    </table>
</body>
</html>
