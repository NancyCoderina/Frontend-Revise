<!DOCTYPE html>
<html>
<head>
    <title>My Eighth Homework</title>
</head>

<body>

    <header>
        <h1>Multimedia in HTML</h1>
    </header>

    <h2>Image</h2>
    <img src="image.jpg" alt="Cat Image" width="250">

    <h2>Audio</h2>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Video</h2>
    <video width="300" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <h2>YouTube Video</h2>
    <iframe
        width="500"
        height="300"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video"
        allowfullscreen>
    </iframe>

    <h2>Figure Example</h2>
    <figure>
        <img src="image.jpg" alt="Sample Image" width="250">
        <figcaption>Image Caption</figcaption>
    </figure>

</body>
</html>
